---
layout: default
title: POSTS INDEX
permalink: /posts/
---

<div id="postsContainer">
    {% for post in site.posts %}
        <div class="post">
            <h2 style="border-bottom: 1px solid #000; margin-bottom: 0;"><a href="{{ post.url }}">{{ post.title }}</a></h2>
            <p>Posted: {{ post.date | date: "%Y %B %e" }}</p>
            <p>{{ post.excerpt }}</p>
        </div>
    {% endfor %}
</div>

---
layout: default
title: POSTS INDEX
---

<div id="postsContainer">
    {% for post in site.posts %}
        <div class="post">
            <h2 style="border-bottom: 1px solid #000; margin-bottom: 0;"><a href="{{ post.url }}">{{ post.title }}</a></h2>
            <p>Posted: {{ post.date }}</p>
            <p>{{ post.excerpt }}</p>
        </div>
    {% endfor %}
</div>
